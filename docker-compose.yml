version: '3.8'

services:
  certscanner:
    build:
      context: .
      dockerfile: Dockerfile
    image: jazonknight/certscanner:latest
    container_name: rufw-certscanner
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-5081}:${PORT:-8080}"
    environment:
      - PORT=${PORT:-8080}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${PORT:-8080}/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 3s
