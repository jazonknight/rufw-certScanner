services:
  certscanner:
    build:
      context: .
      dockerfile: Dockerfile
    image: jazonknight/certscanner:latest
    container_name: rufw-certscanner
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-5081}:8080"
    environment:
      - PORT=8080
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
